<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Ecommerce Project</title>
    <style>
        :root {
            --color-purple: rgb(255, 0, 89);
        }

        *,
        body {
            margin: 0;
        }

        .foot-menu {
            position: fixed;
            transform: translateY(90vh);
            height: 10vh;
            background-color: var(--color-purple);
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .foot-menu .option {
            cursor: pointer;
            flex: 1 0 auto;
            text-align: center;
            font-weight: bolder;
            font-size: medium;
            display: flex;
            justify-content: center;
            color: #fff;
            font-weight: bolder;
        }

        @media(max-width:768px) {
            .foot-menu .option {
                display: grid;
            }
        }

        .container-fluid {
            width: 100%;
        }

        .container {
            width: 90%;
            justify-self: center;
        }
    </style>
</head>

<body>
    <!-- Foot Menu -->
    <div class="foot-menu">
        <div class="option">
            <i>I</i>
            <span>Home</span>
        </div>
        <div class="option">
            <i>I</i>
            <span>Categories</span>
        </div>
        <div class="option">
            <i>I</i>
            <span>Cart</span>
        </div>
        <div class="option">
            <i>I</i>
            <span>Orders</span>
        </div>
        <div class="option">
            <i>I</i>
            <span>Options</span>
        </div>
    </div>
    <!-- Real Page -->
    <div class="container-fluid">
        <div class="container">
            <!-- Pages -->
            <div id="pages">
                <div data-page="home">
                    <!-- Carousel -->
                    <!-- Carousel styles -->
                    <style>
                        .carousel {
                            display: block;
                            width: 100%;
                            border: 1px solid gray;
                            border-radius: 10px;
                            overflow: hidden;
                        }

                        .carousel .carousel-slide {
                            display: flex;
                            flex-wrap: nowrap;
                            overflow: hidden;
                            width: 100%;
                        }

                        @keyframes fade-left {
                            from {
                                transform: translateX(100%);
                            }

                            to {
                                transform: translateX(0%);
                            }
                        }

                        @keyframes fade-out {
                            from {
                                transform: translateX(0%);
                            }

                            to {
                                transform: translateX(-100%);
                            }
                        }

                        .carousel-item.active-item {
                            flex: 1 0 auto;
                            animation: fade-left 1.5s linear;
                            width: 100%;
                        }

                        .carousel-item:not(.active-item) {
                            animation: fade-out 1.5s linear;
                            display: none;
                        }

                        .carousel-item {
                            width: 100%;
                            height: 100%;
                        }

                        .carousel-image img {
                            width: 100%;
                            height: 100%;
                        }

                        /* .carousel-text {
                            position: relative;
                            top: 50px;
                            left: 0px;
                            color: red;
                        } */
                    </style>
                    <div class="carousel">
                        <div class="carousel-slide">
                            <div class="carousel-item">
                                <div class="carousel-image">
                                    <img src="assets/images/RWD.PNG" alt="">
                                </div>
                                <!-- <div class="carousel-text">
                                    This is a carousel text
                                </div> -->
                            </div>
                            <div class="carousel-item">
                                <div class="carousel-image">
                                    <img src="assets/images/RWD.PNG" alt="">
                                </div>
                                <!-- <div class="carousel-text">

                                </div> -->
                            </div>
                            <div class="carousel-item">
                                <div class="carousel-image">
                                    <img src="assets/images/RWD.PNG" alt="">
                                </div>
                                <!-- <div class="carousel-text">

                                </div> -->
                            </div>
                            <div class="carousel-item">
                                <div class="carousel-image">
                                    <img src="assets/images/RWD.PNG" alt="">
                                </div>
                                <!-- <div class="carousel-text">

                                </div> -->
                            </div>
                        </div>
                        <div class="carousel-control">

                        </div>
                    </div>
                    <!-- Carousel Script -->
                    <script>
                        // All Carousels in my code(Optional)
                        const carousel = document.querySelectorAll(".carousel");
                        carousel.forEach(singleCarousel => {
                            // Single Carousel
                            const carouselItems = singleCarousel.querySelectorAll(".carousel-item");
                            for (let id = 0; id < carouselItems.length; id++) {
                                carouselItems.item(id).id = id;
                            }
                            carouselItems.item(0).classList.add("active-item");
                            let activeItem = 0;

                            function increase() {
                                setInterval(() => {
                                    // move to next item
                                    activeItem = (activeItem + 1) % carouselItems.length;

                                    carouselItems.forEach((item, index) => {
                                        if (index === activeItem) {
                                            item.classList.add("active-item");
                                        } else {
                                            item.classList.remove("active-item");
                                        }
                                    });

                                }, 5000);
                            }

                            increase();


                        })
                    </script>
                    <!-- Carousel End -->
                </div>
            </div>
        </div>
    </div>
</body>

</html>
