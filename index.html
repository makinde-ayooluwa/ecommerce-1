<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Ecommerce Project</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> -->
    <style></style>
</head>

<body>
    <!-- Foot Menu -->
    <div class="foot-menu">
        <div class="option">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
        </div>
        <div class="option">
            <i class="bi bi-bookmarks-fill"></i>
            <span>Categories</span>
        </div>
        <div class="option">
            <i class="bi bi-cart-4"></i>
            <span>Cart</span>
        </div>
        <div class="option">
            <i class="bi bi-three-dots"></i>
            <span>Options</span>
        </div>
    </div>
    <!-- Real Page -->
    <div class="container-fluid">
        <div class="container">
            <!-- Pages -->
            <div id="pages">
                <!-- Homepage -->
                <div data-page="home">
                    <!-- Carousel -->
                    <div class="carousel">
                        <!-- Carousel Slide -->
                        <div class="carousel-slide">

                        </div>
                        <!-- Carousel Controls -->
                        <div class="carousel-controls">

                        </div>
                    </div>
                    <!-- Carousel Script -->
                    <script>
                        document.addEventListener("DOMContentLoaded", function () {
                            async function performCarouselActions() {
                                const response = await fetch("./carousel.json");
                                const data = await response.json();
                                data.forEach(({ image }) => {
                                    const carouselSlide = document.querySelector(".carousel-slide");
                                    carouselSlide.innerHTML += `
                                        <div class="carousel-item">
                                            <div class="carousel-image">
                                                <img src="${image}" alt="">
                                            </div>
                                        </div>
                                    `;
                                })
                                console.log(data)
                                // All Carousels in my code(Optional)
                                const carousel = document.querySelectorAll(".carousel");
                                carousel.forEach(singleCarousel => {
                                    // Single Carousel
                                    const carouselItems = singleCarousel.querySelectorAll(".carousel-item");
                                    for (let id = 0; id < carouselItems.length; id++) {
                                        carouselItems.item(id).id = id;
                                    }
                                    carouselItems.item(0).classList.add("active-item");

                                    let activeItem = 0;

                                    function increase() {
                                        // move to next item
                                        setInterval(() => {
                                            activeItem = (activeItem + 1) % carouselItems.length;

                                            carouselItems.forEach((item, index) => {
                                                if (index === activeItem) {
                                                    item.classList.add("active-item");
                                                } else {
                                                    item.classList.remove("active-item");
                                                }
                                            });
                                        }, 5000)
                                    }
                                    increase();
                                })
                            }
                            // Performs all carousel magics
                            performCarouselActions();


                        })
                    </script>
                    <!-- Carousel End -->
                    <div class="home-products">
                        <h5>RECOMMENDED PRODUCTS</h5>
                        <div class="rec-products">
                            <!-- Recommended products script -->
                            <script>
                                const recPage = document.querySelector(".rec-products");
                                async function fetchRecommended() {
                                    const response = await fetch("./rec-products.json");
                                    const data = await response.json();
                                    data.forEach(recProduct => {
                                        recPage.innerHTML += `
                                        <div class="product">
                                            <img src="${recProduct.image}" />
                                            </div>
                                        `;
                                    });
                                }
                                fetchRecommended();
                            </script>
                        </div>
                        <h5>PRODUCTS</h5>
                        <div class="products">
                            
                        </div>
                    </div>
                </div>
                <!-- Homepage Ends -->
            </div>
        </div>
        <!-- Foot Menu Space in the page -->
        <div style="height: 10vh;"></div>
    </div>
</body>

</html>
